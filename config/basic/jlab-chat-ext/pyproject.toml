[build-system]
requires = ["hatchling>=1.5.0", "jupyterlab>=4.2.0,<5"]
build-backend = "hatchling.build"

[project]
name = "jlab_chat_ext"
version = "0.1.0"
description = "JupyterLab Chat Extension"
authors = [{ name = "Robert Charles Murray" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "jupyterlab>=4.2.0,<5"
]

[tool.hatch.build.targets.wheel]
packages = ["jlab_chat_ext"]

[tool.hatch.build.targets.wheel.shared-data]
"frontend/jlab_chat_ext/labextension" = "share/jupyter/labextensions/jlab-chat-ext"
"frontend/install.json" = "share/jupyter/labextensions/jlab-chat-ext/install.json"
