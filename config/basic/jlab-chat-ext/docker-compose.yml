version: '3.8' 

services:
  jupyterlab:
    build:
      context: . 
      dockerfile: Dockerfile
    container_name: jlab-chat-ext
    stdin_open: true 
    tty: true  
    ports:
      - "8888:8888"
      - "3001:3001"
    volumes:
      - .:/home/jovyan
      - ./shared:/home/jovyan/shared
    command: bash
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - CHAT_WS_URL=https://bree.lti.cs.cmu.edu/bazaar/login?roomName=regex&roomId=505&id=1&username=Robbie&html=chat_mm
    command: ./start-dev.sh
