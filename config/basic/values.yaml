hub:
  config:
    JupyterHub:
      authenticator_class: dummy
  extraConfig:
    rtc-config: |
      c.LabApp.collaborative = True

singleuser:
  image:
    name: k8sjacr.azurecr.io/jupyterhub-rtc-7
    tag: latest
  cmd: ["start-notebook.py", "--collaborative=rtc"]
  memory:
    limit: 2G
    guarantee: 1G
  cpu:
    limit: 2
    guarantee: 0.5
  storage:
    extraVolumes:
      - name: jupyterhub-shared
        persistentVolumeClaim:
          claimName: jupyterhub-shared-pvc
    extraVolumeMounts:
      - name: jupyterhub-shared
        mountPath: /home/jovyan/shared
  defaultUrl: "/lab"
  extraEnv:
    JUPYTER_ENABLE_LAB_RTC: "1"
    JUPYTERHUB_SINGLEUSER_APP: jupyter_server.serverapp.ServerApp
  lifecycleHooks:
#     postStart:
#       exec:
#         command: ["/bin/bash", "/home/jovyan/backend/server.js"]
# #         command: ["/bin/bash", "/etc/profile.d/start-chat.sh"]
