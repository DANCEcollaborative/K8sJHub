hub:
  config:
    Authenticator:
      admin_users:
        - user1
    JupyterHub:
      authenticator_class: dummy
      # authenticator_class: ltiauthenticator.lti13.auth.LTI13Authenticator
    # LTI13Authenticator:
      # username_key: "email"
      # issuer: "https://canvas.instructure.com"
      # authorize_url: "https://canvas.instructure.com/api/lti/authorize_redirect"
      # client_id:
      #   - "<CLIENT_ID>"
      # jwks_endpoint: "https://canvas.instructure.com/api/lti/security/jwks"
      # uri_scheme: "https"
      singleuser:
        lifecycleHooks:
          postStart:
            exec:
              command: ["/bin/sh", "-c"]
              args:
                - pip install jupyter-collaboration
                - pip install jupyterlab-chat && jupyter labextension install jupyterlab-chat
singleuser:
  image:
    name: quay.io/jupyterhub/k8s-network-tools
    tag: 4.1.1-0.dev.git.6911.h470c6909
  cmd: null
  storage:
    type: none
    extraVolumes:
      - name: pv-azurefile
        persistentVolumeClaim:
          claimName: pvc-azurefile
    extraVolumeMounts:
      - name: pv-azurefile
        mountPath: /home/jovyan/shared
