version: '3.8'

services:
  jupyter-chat:
    build:
      context: .
      dockerfile: Dockerfile.chat
    container_name: jupyter-chat
    ports:
      - "8888:8888"
    volumes:
      - ./shared:/home/jovyan/shared
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - CHAT_WS_URL=https://bazaar.lti.cs.cmu.edu/bazaar/login?roomName=regex&roomId=505&id=1&username=Robbie&html=chat_mm
    command: >
      start-notebook.py
      --collaborative
      --ServerApp.token=''
      --ServerApp.disable_check_xsrf=True
      --ServerApp.allow_origin='*'
