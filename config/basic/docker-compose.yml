version: '3.8'
services:
  jupyter-chat:
    build:
      context: .
      dockerfile: Dockerfile.chat
      args:
        CACHEBUST: ${CACHEBUST_ARG:-1}
    container_name: jupyter-chat
    ports:
      - "8888:8888"
    volumes:
      - ./shared:/home/jovyan/shared
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - CHAT_WS_URL=https://bazaar.lti.cs.cmu.edu/bazaar/login?roomName=regex&roomId=room500&id=1&username=Charles&html=chat_mm
    user: "1000:100"
    command: start.sh jupyter lab