name: AKS JupyterHub Backup

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (true/false)'
        required: false
        default: 'false'

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Azure CLI
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Install kubectl and helm
        run: |
          sudo snap install kubectl --classic
          sudo snap install helm --classic

      - name: Set up kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run backup script
        run: |
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            python aks_jupyterhub_backup.py --dry-run
          else
            python aks_jupyterhub_backup.py
          fi
        env:
          GITHUB_ACTIONS: true

      - name: Log backup activity
        run: |
          echo "Backup run on $(date -u)" >> backup_log.txt
          git add backup_log.txt
          git diff --cached --quiet || (git commit -m "Log backup run on $(date -u)" && git push)

      - name: Capture git diff
        run: git diff HEAD~1 HEAD > git_diff.txt

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: AKS JupyterHub Backup Notification
          to: rcmurray@andrew.cmu.edu
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            ✅ AKS JupyterHub backup workflow completed successfully.

            📅 Timestamp: $(date -u)

            📁 Changes were committed to the repository if backup files were updated.

            📜 Summary of changes:
            $(cat git_diff.txt)
          attachments: |
            backup_log.txt
            git_diff.txt