USER-SUPPLIED VALUES:
hub:
  config:
    JupyterHub:
      authenticator_class: dummy
  extraConfig:
    rtc-config: |
      c.LabApp.collaborative = True
singleuser:
  cmd:
  - start-notebook.py
  - --collaborative=rtc
  cpu:
    guarantee: 0.5
    limit: 2
  defaultUrl: /lab
  extraEnv:
    JUPYTER_ENABLE_LAB_RTC: "1"
    JUPYTERHUB_SINGLEUSER_APP: jupyter_server.serverapp.ServerApp
    NO_PROXY: collab.lti.cs.cmu.edu,52.149.131.64,135.234.248.176,localhost,127.0.0.1
    no_proxy: collab.lti.cs.cmu.edu,52.149.131.64,135.234.248.176,localhost,127.0.0.1
  extraFiles:
    start-chat:
      mountPath: /etc/profile.d/start-chat.sh
      stringData: |
        #!/bin/bash
        node /srv/chat-backend/server.js &
  image:
    name: k8sjacr.azurecr.io/jupyterhub-rtc-6
    tag: latest
  lifecycleHooks:
    postStart:
      exec:
        command:
        - /bin/bash
        - /etc/profile.d/start-chat.sh
  memory:
    guarantee: 1G
    limit: 2G
